<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Gentleman's Kitchen — Ghanaian Food, Grills & Shawarma in Teshie, Accra</title>
    <meta name="description" content="Fresh Ghanaian food, grills, shawarma, banku and more from Gentleman's Kitchen at Greda Estate, Teshie, Accra. Order easily online via WhatsApp — open from 6AM, hot food ready from 11AM, kitchen open late until around midnight." />
    <link rel="canonical" href="https://www.gentlemans-kitchengh.com/" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0f0b07" />

    <!-- Open Graph (WhatsApp / Facebook link previews) -->
    <meta property="og:type" content="restaurant" />
    <meta property="og:site_name" content="Gentleman's Kitchen" />
    <meta property="og:title" content="Gentleman's Kitchen — Ghanaian Food, Grills & Shawarma in Teshie" />
    <meta property="og:description" content="Fresh Ghanaian food, grills, shawarma & banku at Greda Estate, Teshie. Order via WhatsApp!" />
    <meta property="og:url" content="https://www.gentlemans-kitchengh.com/" />
    <meta property="og:image" content="https://www.gentlemans-kitchengh.com/images/logo.png" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gentleman's Kitchen — Ghanaian Food & Grills in Teshie, Accra" />
    <meta name="twitter:description" content="Order fresh Ghanaian food, grills & shawarma via WhatsApp." />
    <meta name="twitter:image" content="https://www.gentlemans-kitchengh.com/images/logo.png" />

    <link rel="icon" type="image/png" href="/images/logo.png" />

    <!-- Structured data: marks this as a real restaurant for rich Google results -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Restaurant",
      "name": "Gentleman's Kitchen",
      "url": "https://www.gentlemans-kitchengh.com",
      "image": "https://www.gentlemans-kitchengh.com/images/logo.png",
      "servesCuisine": ["Ghanaian", "Grills", "Shawarma"],
      "priceRange": "GHS",
      "telephone": "+233592730579",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Greda Estate, Teshie",
        "addressLocality": "Teshie",
        "addressRegion": "Greater Accra",
        "addressCountry": "GH"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 5.611678,
        "longitude": -0.112177
      },
      "openingHoursSpecification": [{
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],
        "opens": "06:00",
        "closes": "23:30"
      }]
    }
    </script>

    <style>
      html, body { height: 100%; margin: 0; }
      #root { height: 100%; }
      * { -webkit-tap-highlight-color: transparent; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
